name: Build and test CodexPet

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexpet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test Hub and plugin without hardware
        shell: powershell
        run: .\scripts\Test.ps1
      - name: Upload failed integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-integration-diagnostics
          path: CodexPetPlugin/artifacts/CodexPetIntegration-*/
          if-no-files-found: ignore
          retention-days: 7

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodexPetFirmware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build firmware
        run: pio run
      - name: Test audio source generation
        run: python -m unittest discover -s tests -p 'test_*.py'
